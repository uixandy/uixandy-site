          - { name: tagline, label: Kurzbeschreibung, type: text }
          - { name: featured, label: Hervorgehoben, type: boolean }
          - { name: delivery, label: Lieferzeit, type: string }
          - { name: features, label: Leistungen, type: string, list: true }
          - { name: ctaLabel, label: Button-Text, type: string }
      - name: care
        label: Betreuung
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: price, label: Preis, type: string }
          - { name: period, label: Zeitraum, type: string }
          - { name: tagline, label: Kurzbeschreibung, type: text }
          - { name: features, label: Leistungen, type: string, list: true }
      - name: notIncluded
        label: Hinweis Online-Shops
        type: object
        fields:
