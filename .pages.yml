  - name: ratgeber
    label: Ratgeber-Beiträge
    type: collection
    path: src/content/ratgeber
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      sort: pubDate
      order: desc
      columns: [title, pubDate, draft]
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Teaser (für Übersicht und Google)
        type: text
        required: true
      - name: answer
        label: Kurze Antwort (40 bis 60 Wörter, steht oben im Beitrag)
        type: text
        required: true
      - { name: seoTitle, label: Seitentitel Google (optional), type: string }
      - { name: seoDescription, label: Kurzbeschreibung Google (optional), type: text }
      - { name: ogImage, label: Vorschaubild Social Media (optional), type: image }
      - { name: pubDate, label: Veröffentlicht am, type: date, required: true }
      - { name: updatedDate, label: Aktualisiert am (optional), type: date }
      - { name: draft, label: Entwurf (nicht veröffentlichen), type: boolean }
      - { name: body, label: Inhalt, type: rich-text, options: { format: markdown } }

  - name: packages
    label: Pakete und Preise
    type: file
    path: src/data/packages.json
    format: json
    fields:
      - { name: vatNote, label: Hinweis MwSt., type: string }
      - { name: depositNote, label: Hinweis Anzahlung, type: text }
