media:
  input: public/media
  output: /media
  categories: [image, video]

components:
  icon:
    label: Symbol
    type: select
    options:
      values:
        - { value: chat, label: Chat }
        - { value: chats, label: Mehrere Chats }
        - { value: envelope, label: E-Mail }
        - { value: wrench, label: Werkzeug }
        - { value: lock, label: Schloss }
        - { value: lockKey, label: Schloss mit Schlüssel }
        - { value: key, label: Schlüssel }
        - { value: shield, label: Schutzschild }
        - { value: lightning, label: Blitz }
        - { value: globe, label: Weltkugel }
        - { value: undo, label: Rückgängig }
        - { value: creditCard, label: Kreditkarte }
        - { value: search, label: Lupe }
        - { value: mobile, label: Handy }
        - { value: pencil, label: Stift }
        - { value: checkCircle, label: Haken }
        - { value: calendar, label: Kalender }
        - { value: rocket, label: Rakete }
        - { value: sparkle, label: Funkeln (KI) }
        - { value: storefront, label: Laden }
        - { value: files, label: Seiten }
        - { value: translate, label: Sprachen }
        - { value: briefcase, label: Aktentasche }
        - { value: article, label: Artikel }
        - { value: calculator, label: Rechner }
        - { value: handshake, label: Handschlag }
        - { value: paintBrush, label: Pinsel }
        - { value: plugs, label: Verbindung }
        - { value: gauge, label: Tacho }

  cards:
    label: Karten
    type: object
    list: true
    fields:
      - name: icon
        component: icon
      - name: title
        label: Titel
        type: string
      - name: text
        label: Text
        type: text

  steps:
    label: Schritte (gestapelte Karten)
    type: object
    list: true
    fields:
      - name: title
        label: Titel
        type: string
      - name: text
        label: Text
        type: text
      - name: example
        label: Beispiel-Nachricht (optional)
        type: string
        description: "Erscheint als Chat-Blase unter dem Schritt. Leer lassen = keine Blase."
      - name: visual
        label: Grafik auf der Karte
        type: select
        options:
          values:
            - { value: check, label: Website-Check (Fragebogen) }
            - { value: build, label: Website wird gebaut }
            - { value: connect, label: KI wird verbunden }
            - { value: live, label: Änderung geht live }
            - { value: pay, label: Anzahlung oder Gespräch }
            - { value: review, label: Prüfung des Projekts }
      - name: tags
        label: Schwebende Stichworte auf der Grafik (max. 2)
        type: string
        list: true

  faq:
    label: Fragen und Antworten
    type: object
    list: true
    fields:
      - name: question
        label: Frage
        type: string
      - name: answer
        label: Antwort
        type: text

  cta:
    label: Abschluss-Bereich (Call to Action)
    type: object
    fields:
      - name: heading
        label: Überschrift
        type: string
      - name: text
        label: Text
        type: text
      - name: primaryLabel
        label: Haupt-Button (führt zum Website-Check)
        type: string
      - name: secondaryLabel
        label: Zweiter Button (führt zur Terminbuchung)
        type: string

  nudge:
    label: Hinweis mitten auf der Seite (mit Website-Check-Button)
    type: object
    fields:
      - { name: text, label: Satz über dem Button, type: text }
      - { name: linkLabel, label: Link-Text (führt zur Terminbuchung), type: string }

  compare:
    label: Vergleichstabelle
    type: object
    fields:
      - name: kicker
        label: Kleine Überschrift
        type: string
      - name: heading
        label: Überschrift
        type: string
      - name: oldLabel
        label: Spalte links (alt)
        type: string
      - name: newLabel
        label: Spalte rechts (neu)
        type: string
      - name: rows
        label: Zeilen
        type: object
        list: true
        fields:
          - { name: topic, label: Thema, type: string }
          - { name: old, label: Alt, type: string }
          - { name: new, label: Neu, type: string }

  pageHero:
    label: Kopfbereich
    type: object
    fields:
      - { name: kicker, label: Kleine Überschrift, type: string }
      - { name: heading, label: Hauptüberschrift (H1), type: string }
      - { name: lead, label: Einleitungstext, type: text }

content:
  - name: pages
    label: Seiten
    type: group
    items:
      - name: home
        label: Startseite
        type: file
        path: src/data/pages/home.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: ogImage, label: Vorschaubild Social Media, type: image }
          - name: hero
            label: Kopfbereich
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Hauptüberschrift (H1), type: string }
              - name: headingHighlight
                label: Hervorgehobener Teil der Überschrift
                type: string
                description: "Wird im Farbverlauf dargestellt. Muss genau so in der Überschrift vorkommen."
              - { name: lead, label: Einleitungstext, type: text }
              - { name: primaryLabel, label: Haupt-Button, type: string }
              - { name: secondaryLabel, label: Zweiter Button (zu den Preisen), type: string }
              - { name: trust, label: Vertrauens-Punkte unter den Buttons, type: string, list: true }
              - name: demo
                label: Chat-Animation
                type: object
                fields:
                  - { name: siteName, label: Name der Beispiel-Website, type: string }
                  - { name: siteTagline, label: Untertitel der Beispiel-Website, type: string }
                  - { name: hoursOld, label: Öffnungszeiten vorher, type: string }
                  - { name: hoursNew, label: Öffnungszeiten nachher, type: string }
                  - { name: banner, label: Hinweis-Banner (erscheint nach der Änderung), type: string }
                  - { name: userMessage, label: Nachricht an die KI, type: text }
                  - { name: aiMessage, label: Antwort der KI, type: text }
                  - { name: statusPending, label: Status während Veröffentlichung, type: string }
                  - { name: statusLive, label: Status nach Veröffentlichung, type: string }
                  - { name: caption, label: Bildunterschrift, type: string }
          - name: prompts
            label: Bereich Beispiel-Nachrichten (Laufband)
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: rowA, label: Nachrichten obere Reihe, type: string, list: true }
              - { name: rowB, label: Nachrichten untere Reihe, type: string, list: true }
          - name: problem
            label: Bereich Probleme
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: items, component: cards }
          - name: how
            label: Bereich So funktioniert's
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: items, component: steps }
              - { name: linkLabel, label: Link-Text zur Detailseite, type: string }
          - name: video
            label: Bereich Video
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - name: src
                label: Video-Datei (MP4)
                type: file
                description: "Leer lassen = Platzhalter wird angezeigt."
              - { name: poster, label: Vorschaubild des Videos, type: image }
              - { name: placeholderText, label: Text im Platzhalter, type: text }
              - { name: caption, label: Bildunterschrift, type: string }
          - name: benefits
            label: Bereich Vorteile
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - name: items
                label: Vorteile (Kacheln)
                type: object
                list: true
                fields:
                  - { name: title, label: Titel, type: string }
                  - { name: text, label: Text, type: text }
                  - name: visual
                    label: Grafik oben in der Kachel
                    type: select
                    options:
                      values:
                        - { value: chat, label: Chat mit Antwort }
                        - { value: shield, label: Schutzschild }
                        - { value: versions, label: Versionen }
                        - { value: owner, label: Ihr Konto }
                        - { value: speed, label: Ladezeit-Balken }
                        - { value: editor, label: Editor }
                        - { value: none, label: Keine Grafik }
          - name: pricing
            label: Bereich Preise (Pakete selbst unter "Pakete und Preise")
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
          - name: proof
            label: Bereich Kundenstimmen
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - name: items
                label: Kundenstimmen
                type: object
                list: true
                fields:
                  - { name: quote, label: Zitat, type: text }
                  - { name: name, label: Name, type: string }
                  - { name: role, label: Firma / Rolle, type: string }
                  - { name: placeholder, label: Noch Platzhalter (gestrichelter Rahmen), type: boolean }
              - { name: linkLabel, label: Link-Text zu den Beispielen, type: string }
          - name: faq
            label: Bereich Fragen
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: items, component: faq }
          - { name: cta, component: cta }

      - name: so-funktionierts
        label: So funktioniert's
        type: file
        path: src/data/pages/so-funktionierts.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: hero, component: pageHero }
          - name: steps
            label: Bereich Ablauf
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: items, component: steps }
          - name: examples
            label: Bereich Beispiel-Nachrichten
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: items, component: cards }
          - name: safety
            label: Bereich Sicherheit
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: items, component: cards }
          - { name: compare, component: compare }
          - { name: nudge, component: nudge }
          - { name: cta, component: cta }

      - name: preise
        label: Preise
        type: file
        path: src/data/pages/preise.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: hero, component: pageHero }
          - name: process
            label: Bereich Buchungsablauf
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: items, component: steps }
          - name: faq
            label: Bereich Fragen
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: items, component: faq }
          - { name: nudge, component: nudge }
          - { name: cta, component: cta }

      - name: beispiele
        label: Beispiele
        type: file
        path: src/data/pages/beispiele.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: hero, component: pageHero }
          - name: cases
            label: Kundenprojekte
            type: object
            list: true
            fields:
              - { name: name, label: Firmenname, type: string }
              - { name: industry, label: Branche, type: string }
              - { name: image, label: Screenshot, type: image }
              - { name: imageAlt, label: Bildbeschreibung, type: string }
              - { name: url, label: Link zur Website, type: string }
              - { name: before, label: Vorher, type: text }
              - { name: after, label: Jetzt, type: text }
              - { name: quote, label: Zitat, type: text }
              - { name: quoteName, label: Name zum Zitat, type: string }
              - { name: placeholder, label: Noch Platzhalter, type: boolean }
          - { name: cta, component: cta }

      - name: wordpress-alternative
        label: WordPress-Alternative
        type: file
        path: src/data/pages/wordpress-alternative.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: hero, component: pageHero }
          - name: answer
            label: Kurze Antwort (oben, für Google und KI-Suchen)
            type: object
            fields:
              - { name: heading, label: Überschrift, type: string }
              - { name: text, label: Text (40 bis 60 Wörter), type: text }
          - { name: compare, component: compare }
          - name: fit
            label: Bereich Wann WordPress besser passt
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: items, component: cards }
          - name: faq
            label: Bereich Fragen
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: items, component: faq }
          - { name: nudge, component: nudge }
          - { name: cta, component: cta }

      - name: ueber-mich
        label: Über mich
        type: file
        path: src/data/pages/ueber-mich.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - name: hero
            label: Kopfbereich
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Hauptüberschrift (H1), type: string }
              - { name: lead, label: Einleitungstext, type: text }
              - { name: image, label: Foto, type: image }
              - { name: imageAlt, label: Bildbeschreibung, type: string }
          - name: story
            label: Bereich Geschichte
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: paragraphs, label: Absätze, type: text, list: true }
          - name: values
            label: Bereich Arbeitsweise
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: items, component: cards }
          - name: personal
            label: Bereich Persönlich
            type: object
            fields:
              - { name: kicker, label: Kleine Überschrift, type: string }
              - { name: heading, label: Überschrift, type: string }
              - { name: text, label: Text, type: text }
              - name: images
                label: Fotos (genau 3, das mittlere steht gerade)
                type: object
                list: true
                fields:
                  - { name: image, label: Foto, type: image }
                  - { name: alt, label: Bildbeschreibung, type: string }
          - { name: cta, component: cta }

      - name: website-check
        label: Website-Check
        type: file
        path: src/data/pages/website-check.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: hero, component: pageHero }
          - name: form
            label: Formular-Texte
            type: object
            description: "Nur die sichtbaren Texte. Die Werte (value) der Antworten bitte nicht ändern, daran hängt die Paket-Empfehlung."
            fields:
              - name: progressLabel
                label: Fortschritt
                type: string
                description: "{n} = aktuelle Frage, {total} = Anzahl Fragen. Beispiel: Frage {n} von {total}"
              - { name: nextLabel, label: Button Weiter, type: string }
              - { name: backLabel, label: Link Zurück, type: string }
              - { name: websiteLabel, label: Frage 1, type: string }
              - { name: websiteHint, label: Frage 1 Hinweis, type: string }
              - { name: websitePlaceholder, label: Frage 1 Platzhalter, type: string }
              - { name: noWebsiteLabel, label: Frage 1 Link ohne Website, type: string }
              - { name: pagesLabel, label: Frage 2, type: string }
              - name: pagesOptions
                label: Frage 2 Antworten
                type: object
                list: true
                fields:
                  - { name: value, label: Interner Wert (nicht ändern), type: string }
                  - { name: label, label: Text, type: string }
              - { name: featuresLabel, label: Frage 3, type: string }
              - { name: featuresHint, label: Frage 3 Hinweis, type: string }
              - { name: featuresNoneLabel, label: Frage 3 Button ohne Auswahl, type: string }
              - name: featuresOptions
                label: Frage 3 Antworten
                type: object
                list: true
                fields:
                  - { name: value, label: Interner Wert (nicht ändern), type: string }
                  - { name: label, label: Text, type: string }
              - { name: timingLabel, label: Frage 4, type: string }
              - name: timingOptions
                label: Frage 4 Antworten
                type: object
                list: true
                fields:
                  - { name: value, label: Interner Wert (nicht ändern), type: string }
                  - { name: label, label: Text, type: string }
              - { name: contactLabel, label: Überschrift Kontaktdaten, type: string }
              - { name: moreLabel, label: Aufklapper für Firma und Nachricht, type: string }
              - { name: nameLabel, label: Feld Name, type: string }
              - { name: emailLabel, label: Feld E-Mail, type: string }
              - { name: companyLabel, label: Feld Firma, type: string }
              - { name: messageLabel, label: Feld Nachricht, type: string }
              - { name: consentText, label: Einwilligungstext, type: text }
              - { name: submitLabel, label: Button-Text, type: string }
              - { name: sendingLabel, label: Button-Text beim Senden, type: string }
              - { name: errorText, label: Fehlermeldung, type: text }
          - name: analyze
            label: Website-Analyse (nach Frage 1)
            type: object
            description: "{n} wird automatisch durch die Zahl ersetzt."
            fields:
              - { name: heading, label: Überschrift während der Analyse, type: string }
              - { name: rowSystem, label: Zeile System, type: string }
              - { name: rowPages, label: Zeile Seiten, type: string }
              - { name: rowFeatures, label: Zeile Funktionen, type: string }
              - { name: rowSpeed, label: Zeile Ladezeit, type: string }
              - { name: working, label: Text während der Prüfung, type: string }
              - { name: waitingNote, label: Hinweis Wartezeit (damit es nicht hängt wirkt), type: string }
              - { name: noSystem, label: Kein System erkannt, type: string }
              - { name: pagesSitemap, label: Seitenzahl aus Sitemap, type: string }
              - { name: pagesLinks, label: Seitenzahl aus Links, type: string }
              - { name: pagesUnknown, label: Seitenzahl unbekannt, type: string }
              - { name: noFeatures, label: Keine Funktionen gefunden, type: string }
              - { name: speedScore, label: Ladezeit-Ergebnis, type: string }
              - { name: speedUnknown, label: Ladezeit nicht messbar, type: string }
              - { name: unreachable, label: Website nicht erreichbar, type: text }
              - { name: disclaimer, label: Kurzer Hinweis unter der Analyse, type: text }
              - { name: prefilledNote, label: Hinweis bei vorausgewählten Antworten, type: string }
              - { name: otherUrl, label: Link andere Adresse, type: string }
          - name: results
            label: Ergebnis-Texte
            type: object
            fields:
              - name: start
                label: Ergebnis Start
                type: object
                fields:
                  - { name: title, label: Überschrift, type: string }
                  - { name: text, label: Text, type: text }
              - name: individuell
                label: Ergebnis Individuell
                type: object
                fields:
                  - { name: title, label: Überschrift, type: string }
                  - { name: text, label: Text, type: text }
              - name: gespraech
                label: Ergebnis Gespräch empfohlen
                type: object
                fields:
                  - { name: title, label: Überschrift, type: string }
                  - { name: text, label: Text, type: text }
              - name: shop
                label: Ergebnis Online-Shop (Ablehnung)
                type: object
                fields:
                  - { name: title, label: Überschrift, type: string }
                  - { name: text, label: Text, type: text }
              - { name: shopNote, label: Hinweis bei Online-Shop, type: string }
              - { name: shopCallLabel, label: Button Gespräch ohne Shop, type: string }
              - { name: depositLabel, label: Button Anzahlung, type: string }
              - { name: callLabel, label: Button Gespräch, type: string }
              - { name: refundNote, label: Hinweis Rückerstattung, type: text }
              - { name: sentNote, label: Bestätigung nach dem Absenden, type: string }

      - name: ratgeber-hub
        label: Ratgeber (Übersicht)
        type: file
        path: src/data/pages/ratgeber.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: hero, component: pageHero }
          - { name: emptyText, label: Text wenn noch keine Beiträge, type: string }
          - { name: readMoreLabel, label: Link-Text Weiterlesen, type: string }
          - name: cta
            label: Abschluss-Bereich (Übersicht und alle Beiträge)
            type: object
            fields:
              - { name: heading, label: Überschrift, type: string }
              - { name: text, label: Text, type: text }
              - { name: primaryLabel, label: Haupt-Button (führt zum Website-Check), type: string }

      - name: impressum
        label: Impressum
        type: file
        path: src/data/pages/impressum.json
        format: json
        fields:
          - { name: seoTitle, label: Seitentitel (Google), type: string, required: true }
          - { name: seoDescription, label: Kurzbeschreibung (Google), type: text, required: true }
          - { name: heading, label: Überschrift, type: string }
          - { name: notice, label: Hinweis-Kasten (leer lassen), type: text }
          - { name: bodyHtml, label: Inhalt, type: rich-text }
      - name: datenschutz
        label: Datenschutz
