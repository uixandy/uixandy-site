          - { name: text, label: Text, type: text }

  - name: site
    label: Firmendaten und Links
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: title, label: Name, type: string, required: true }
      - { name: legalName, label: Rechtlicher Name, type: string }
      - { name: claim, label: Claim (Standard-Beschreibung), type: text }
      - { name: email, label: E-Mail, type: string }
      - { name: phone, label: Telefon (Anzeige), type: string }
      - { name: phoneHref, label: Telefon (Link, z. B. +4915678735632), type: string }
      - { name: logoPath, label: Standard-Vorschaubild, type: string }
      - name: address
        label: Adresse
        type: object
        fields:
